<h2 class="px-6 pt-6 text-xl" mat-dialog-title>Create folder</h2>
<mat-dialog-content>
  <mat-form-field>
    <input placeholder="Enter folder name" matInput [(ngModel)]="title" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="title()" cdkFocusInitial>Save</button>
</mat-dialog-actions>
