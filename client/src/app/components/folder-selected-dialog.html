<div class="flex px-6 pt-6 w-full h-full justify-between items-center">
  <h2 class="text-2xl" mat-dialog-title>Folders</h2>
  <div class="text-sm">{{selectedFolders.length}} folders selected</div>
</div>
<mat-dialog-content>
  <div class="flex flex-col">
    <mat-form-field>
      <input (input)="handleFilter($event)" placeholder="Search folders" matInput/>
    </mat-form-field>
    <div class="flex flex-col max-h-50 overflow-y-scroll">
        @for (folder of filteredFolders; track folder) {
          <mat-checkbox [checked]="folder.checked" (change)="onCheckboxChange($event, folder)">{{folder.title}}</mat-checkbox>
        }
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="this.selectedFolders" cdkFocusInitial>Save</button>
</mat-dialog-actions>
