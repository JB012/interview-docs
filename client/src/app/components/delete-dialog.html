<h2 class="px-6 pt-6 text-xl" mat-dialog-title>Delete</h2>
<mat-dialog-content>
    <div>Are you sure you want to delete this item?</div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>Delete</button>
</mat-dialog-actions>
