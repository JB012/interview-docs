<div class="flex px-6 pt-6  w-full h-full justify-between items-center">
  <h2 class="text-2xl" mat-dialog-title>Select questions</h2>
  <div class="text-sm">{{selectedQuestions.length}} questions selected</div>
</div>
<mat-dialog-content>
  <div class="flex flex-col">
    <mat-form-field>
      <input (input)="handleFilter($event)" placeholder="Search questions" matInput/>
    </mat-form-field>
    <div class="flex flex-col max-h-50 overflow-y-scroll">
        @for (question of filteredQuestions; track question) {
          <mat-checkbox (change)="onCheckboxChange($event, question)">{{question.question}}</mat-checkbox>
        }
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Cancel</button>
  <button matButton [mat-dialog-close]="this.selectedQuestions" cdkFocusInitial>Add</button>
</mat-dialog-actions>
