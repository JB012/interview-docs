<div class="flex flex-col relative gap-2 xxs:text-[8px] xs:text-xs md:text-sm">
    <div id="menu-button" (click)="updateMenuView()" class="flex items-center gap-2 outline text-center rounded-full xxs:px-1 px-2 hover:backdrop-brightness-95 cursor-pointer">    
        <span class="flex justify-center items-center">{{sortBy()}}</span>
        <span class="material-symbols-outlined xxs xs:material-symbols-outlined xs lg:material-symbols-outlined lg">&#xe313;</span>
    </div>
    @if (menuOpened()) {
        <div appClickOutside (clickOutside)="onClickOutside()" class="absolute top-6 z-10 flex flex-col bg-[#FDF9F0] rounded-2xl p-3">
        <div id="sort-options" class="flex flex-col w-full">
            <div class="text-gray-500 self-center">Sort By</div>
            <div [class.bg-sky-400]="sortBy() === 'Alphabetical'" class="px-2 flex justify-end items-center hover:bg-sky-400 cursor-pointer rounded-md">
                <span (click)="updateSortBy('Alphabetical');">Alphabetical</span>
            </div>
            <div [class.bg-sky-400]="sortBy() === 'Date created'" class="px-2 whitespace-nowrap flex justify-end items-center hover:bg-sky-400 cursor-pointer rounded-md">
                <span (click)="updateSortBy('Date created');">Date created</span>
            </div>
            <div [class.bg-sky-400]="sortBy() === 'Last viewed'" class="px-2 flex justify-end items-center hover:bg-sky-400 cursor-pointer rounded-md">
                <span class="whitespace-nowrap" (click)="updateSortBy('Last viewed');">Last viewed</span>
            </div>
        </div>
        <div class="py-2"><hr/></div>
        <div id="order-options" class="flex flex-col w-full">
            <div class="self-center">Order</div>
                <div [class.bg-sky-400]="orderBy() === 'A-Z' || orderBy() === 'Newest first'" class="px-2 flex justify-center items-center hover:bg-sky-400 cursor-pointer rounded-md">
                    <span class="whitespace-nowrap" (click)="updateOrderBy(sortBy() === 'Alphabetical' ? 'A-Z' : 'Newest first'); updateMenuView()">{{sortBy() === "Alphabetical" ? "A-Z" : "Newest first"}}</span>
                </div>
                <div [class.bg-sky-400]="orderBy() === 'Z-A' || orderBy() === 'Oldest first'" class="px-2 flex justify-center items-center hover:bg-sky-400 cursor-pointer rounded-md">
                    <span class="whitespace-nowrap" (click)="updateOrderBy(sortBy() === 'Alphabetical' ? 'Z-A' : 'Oldest first'); updateMenuView()">{{sortBy() === "Alphabetical" ? "Z-A" : "Oldest first"}}</span>
                </div>
            </div>
    </div>
    }
</div>
