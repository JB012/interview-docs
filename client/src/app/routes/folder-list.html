 @if (folders$ | async; as folders) {
    <div class="flex flex-col w-full h-full p-4">
        <div class="flex w-full justify-between items-center">
            <div class="flex xxs:gap-0.5 xs:gap-2 items-center">
                <div class="xxs:text-xs xs:text-sm lg:text-lg">Folders</div>
                <button (click)="openDialog()" class="flex bg-primary text-white lg:w-6 lg:h-6 xs:w-4 xs:h-4 xs:text-xs xxs:w-2 xxs:h-2 xxs:text-[4px] w-8 h-8 justify-center items-center rounded-full cursor-pointer hover:brightness-110">+</button>
            </div>
            <menu-button type="folders" class="py-2" [updateFolders]="updateFolders" [(sortBy)]="sortValue" [(orderBy)]="orderValue" /> 
        </div>
        @if (folders.content && folders.totalSize > 0) {
            <table [updateFolders]="updateFolders" [folders]="folders.content" [sortValue]="sortValue()" [orderValue]="orderValue()"></table>
            <mat-paginator
            (page)="handlePageEvent($event)"
            [hidePageSize]="true"
            [length]="folders.totalSize"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            ></mat-paginator>
        }
        @else {
            <div class="flex pt-8 w-full h-full justify-center"> 
                <div>No folders added</div>
            </div>
        } 
    </div>
 }
@else {
    <div class="flex w-full h-full justify-center items-center">
        <mat-spinner diameter="24"></mat-spinner>
    </div>
}
