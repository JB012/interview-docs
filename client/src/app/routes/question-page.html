@if (question$ | async; as question) {
    <div class="flex flex-col w-full h-full p-4">
        <div class="flex w-full gap-2 items-center">    
            <div id="question" class="text-md xs:text-2xl truncate py-4">
                <span id="questionInput" [textContent]="question.question" (input)="updateQuestion($event)" role="textbox" contenteditable alt="question-title-input"></span>
            </div>
            <div>
                @if (saveState() === "saved") {
                    <div>Saved</div>
                }
            </div>
        </div>
        <hr>
        <div class="flex">
            <div (click)="updateOption('text')" [class]="this.option() === 'text' ? 'selected-option backdrop-brightness-95 hover:backdrop-brightness-95' : 'selected-option hover:backdrop-brightness-95'">Text</div>
            <div (click)="navigateToVideos()" [class]="this.option() === 'video' ? 'selected-option backdrop-brightness-95 hover:backdrop-brightness-95' : 'selected-option hover:backdrop-brightness-95'">Video</div>
        </div>
        @if (this.option() === "text") {
            <div class="flex flex-col w-full h-full gap-2">
                <button matButton="filled" class="self-end">Save</button>
                <textarea id="answerInput" (input)="updateQuestion($event)" [textContent]="question.answer" class="w-full h-full p-2" placeholder="Enter response here..."></textarea>
            </div>
        }
        @else {
            <router-outlet></router-outlet>
        }
    </div>
}
