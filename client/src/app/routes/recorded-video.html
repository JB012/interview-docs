<div class="flex flex-col gap-4 w-full h-full">
    <div class="flex gap-2 cursor-pointer" (click)="navigateToVideoList()">
        <span class="self-start material-symbols-outlined">&#xe5c4;</span>
        <div>Back to List</div>
    </div>
    <div class="flex flex-col w-full h-full gap-4 justify-center">
      @if (currentVideo() === "recorded") {
          <div class="flex justify-center gap-8">
            <button matButton="outlined" (click)="updateCurrentVideo('preview'); retrieveStream();">Record New Video</button>
            <button [disabled]="disableSave()" matButton="filled" (click)="openDialog()">Save</button>
          </div>
        }
        <div class="flex justify-center">
            <div #videoContainer class="w-180 h-101.25 relative">
                @if (currentVideo() === "preview" && !video$) {
                  <video class="w-full" #video autoplay muted></video>
                  @if (videoLoaded()) {
                    <video-controls (updateFullScreen)="updateFullScreen()" (startRecording)="startRecording()" (stopRecording)="stopRecording()" class="flex w-full absolute z-10 bottom-0"/>
                  }
                }  
                @else {
                  @if (video$ | async; as video) {
                    <video class="w-full" controls [src]="video.source"></video>
                  }
                  @else {
                    <video class="w-full" controls #recordedVideo></video>
                  }
                }
            </div>
        </div>
    </div>
</div>
