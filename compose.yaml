services:
  app-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: /run/secrets/db_host
      DB_USERNAME: /run/secrets/db_username
      DB_PASSWORD: /run/secrets/db_password
    secrets:
      - db_username
      - db_password
      - db_host
    develop:
      watch:
        - action: sync+restart
          path: .
          target: .
        - action: rebuild
          path: ./server/build.gradle
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_username:
    file: ./secrets/db_username.txt
  db_host:
    file: ./secrets/db_host.txt