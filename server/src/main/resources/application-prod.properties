jpa.default.properties.hibernate.hbm2ddl.auto=validate
jpa.default.properties.hibernate.show_sql=false
jpa.default.properties.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
jpa.default.properties.hibernate.jdbc.time_zone=UTC
micronaut.server.host=0.0.0.0
micronaut.server.ssl.enabled=true
micronaut.security.redirect.login-success=https://www.interviewdocs.net/home
micronaut.security.oauth2.clients.auth0.openid.issuer=https://auth.interviewdocs.net/
micronaut.server.cors.configurations.web.allowed-origins[0]=https://www.interviewdocs.net
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.security.token.cookie.cookie-secure=true
micronaut.security.token.cookie.cookie-same-site=Strict
micronaut.server.ssl.key-store.path=classpath:micronaut-keystore.p12
micronaut.server.ssl.key-store.password=${KEY_STORE_PASSWORD}
micronaut.server.ssl.key-store.type=PKCS12
micronaut.server.forward-headers=true
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.password=${DB_PASSWORD}
datasources.default.url=jdbc:postgresql://${DB_HOST}:5432/postgres?user=${DB_USERNAME}&password=${DB_PASSWORD}
datasources.default.username=${DB_USERNAME}
datasources.default.maximum-pool-size=2
datasources.default.minimum-idle=0
datasources.default.initialization-fail-timeout=-1